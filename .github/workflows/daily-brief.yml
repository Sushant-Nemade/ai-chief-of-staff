name: Daily brief
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  send:
    if: vars.ENABLE_DAILY_BRIEF == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployed brief service
        env:
          BRIEF_URL: ${{ secrets.BRIEF_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BRIEF_URL"
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$BRIEF_URL/api/cron/brief"
